<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  
</head>
<body>
  <div class="form-container">
    <h2>Contact the team</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/submit-feedback" method="POST" enctype="multipart/form-data">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="type">Subject</label>
      <select id="type" name="type" required>
        <option value="Feedback">General Feedback</option>
        <option value="Bug">Report a Problem</option>
        <option value="Demo">Request a Product Demo</option>
        <option value="PasswordReset">Reset My Password</option>
        <option value="Terminate">Close My Account</option>
        <option value="AccountUpdate">Update Account Information</option>
        <option value="Billing">Billing or Payment Question</option>
        <option value="Refund">Request a Refund</option>
        <option value="Subscription">Manage My Subscription</option>
        <option value="Upgrade">Upgrade Plan</option>
        <option value="Downgrade">Downgrade Plan</option>
        <option value="FeatureRequest">Request a New Feature</option>
        <option value="Integration">Integration or API Support</option>
        <option value="Security">Report a Security Concern</option>
        <option value="DataExport">Request Data Export</option>
        <option value="Performance">Report Performance Issue</option>
        <option value="MobileApp">Mobile App Support</option>
        <option value="Notification">Email or Notification Issue</option>
        <option value="Access">Access or Permission Problem</option>
        <option value="Training">Request Training or Onboarding Help</option>
        <option value="Partnership">Partnership Inquiry</option>
        <option value="Consultation">Request a Consultation</option>
        <option value="Documentation">Request Documentation or Guides</option>
        <option value="Other">Other (please specify in message)</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message here..." rows="5" required></textarea>

      <button type="submit">Send Message</button>

    </form>
  </div>
</body>
</html>
